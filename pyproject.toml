[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulum-ip"
description = "A proxy layer between ip and reticulum"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "rns>=1.5",
    # "asyncio-socks-server>1.3.3"
]
classifiers = [
    # "Programming Language :: Python :: 3",
    # "Operating System :: OS Independent",
    # "Topic :: Communications :: Conferencing",
]

[project.optional-dependencies]
hotkeys = ["pynput"]

[project.scripts]
partyline = "partyline.gui:main"
partyline-server = "partyline.server:main"
partyline-client = "partyline.client:main"

